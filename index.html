<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الخدمات والأنشطة الكنسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <div class="admin-btn-container">
            <button class="btn-admin" id="adminToggleBtn" onclick="toggleAdminPanel()">🔒 لوحة المسؤول</button>
        </div>
        <h1>أرشيف الخدمات والأنشطة الكنسية</h1>
        <p>سجل الأنشطة، الألعاب، والمواضيع السحابي المباشر</p>
    </header>

    <div class="container">
        
        <!-- لوحة تحكم المسؤول -->
        <div id="admin-panel">
            <h3>لوحة تحكم المسؤول (إضافة وتعديل)</h3>
            <form id="archiveForm" onsubmit="saveItem(event)">
                <input type="hidden" id="editItemId">
                <div class="form-group">
                    <label>نوع المحتوى</label>
                    <select id="itemCategory" required>
                        <option value="لعبة">لعبة (Game)</option>
                        <option value="موضوع">موضوع (Topic)</option>
                        <option value="ترنيمة">ترنيمة (Anthem)</option>
                        <option value="لعبة كبرى">لعبة كبرى (Major Game)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="itemTitle" placeholder="مثال: مسابقة الكتاب المقدس" required>
                </div>
                <div class="form-group">
                    <label>التفاصيل / الوصف</label>
                    <textarea id="itemDesc" rows="3" placeholder="تفاصيل النشاط..." required></textarea>
                </div>
                <div class="form-group">
                    <label>التاريخ (التقويم)</label>
                    <input type="date" id="itemDate" required>
                </div>
                <button type="submit" class="btn-primary" id="saveBtn">حفظ ونشر بالسحاب ✦</button>
            </form>

            <hr style="border-color: var(--border); margin: 20px 0;">

            <h3>إضافة فائز بجائزة جديدة 🏆</h3>
            <form id="awardForm" onsubmit="saveAward(event)">
                <div class="form-group">
                    <label>اسم الجائزة / النشاط</label>
                    <input type="text" id="awardTitle" placeholder="مثال: بطولة الألعاب الكبرى" required>
                </div>
                <div class="form-group">
                    <label>اسم الفائز (مع الإيموجي 👑 👦🏻 👧🏻)</label>
                    <input type="text" id="winnerName" placeholder="👑 اسم الفائز" required>
                </div>
                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" id="awardDate" required>
                </div>
                <button type="submit" class="btn-primary" style="background: var(--accent); color: #fff;">إضافة الفائز للتايم لاين ✦</button>
            </form>
        </div>

        <!-- أزرار الفلاتر والتنقل -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all', this)">📌 الكل</button>
            <button class="tab-btn" onclick="switchTab('لعبة', this)">🎮 ألعاب</button>
            <button class="tab-btn" onclick="switchTab('موضوع', this)">📖 مواضيع</button>
            <button class="tab-btn" onclick="switchTab('ترنيمة', this)">🎵 ترانيم</button>
            <button class="tab-btn" onclick="switchTab('لعبة كبرى', this)">🏆 ألعاب كبرى</button>
        </div>

        <div id="sync-status">جاري مزامنة البيانات من السحاب... ☁️</div>
        
        <!-- قائمة عرض الأرشيف -->
        <div id="archiveContainer"></div>

        <!-- سجل الفائزين (التايم لاين) -->
        <div class="timeline-container">
            <div class="timeline-title">👑 سجل الفائزين والألعاب الكبرى</div>
            <div id="awardsContainer"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
